name: HOPE Bootstrap → ZIP → Prepare → Copilot Autopilot

on:
  workflow_dispatch:
    inputs:
      archive:
        description: "ZIP filename in repository. Leave empty to auto-detect."
        required: false
        type: string
        default: ""

      start_agent:
        description: "Start GitHub Copilot automatically."
        required: false
        type: boolean
        default: true

      max_autopilot_continues:
        description: "Maximum Copilot autonomous continuations."
        required: false
        type: number
        default: 12

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: hope-bootstrap-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGING_DIR: /tmp/hope-bootstrap

jobs:
  bootstrap:
    name: Bootstrap HOPE
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:

      # ============================================================
      # 1 — CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      # ============================================================
      # 2 — INITIALIZE
      # ============================================================

      - name: Initialize bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "HOPE BOOTSTRAP"
          echo "=============================================="
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Branch     : $GITHUB_REF_NAME"
          echo "Commit     : $GITHUB_SHA"
          echo "Workspace  : $GITHUB_WORKSPACE"
          echo "Runner     : $RUNNER_OS"
          echo

          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"

          git status --short
          git branch --show-current

      # ============================================================
      # 3 — VERIFY GIT AUTHENTICATION
      # ============================================================

      - name: Verify Git authentication
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Checking Git remote..."
          git remote -v

          echo
          echo "Testing authenticated repository access..."

          git ls-remote origin HEAD >/dev/null

          echo
          echo "Git authentication: OK"

      # ============================================================
      # 4 — FIND ZIP
      # ============================================================

      - name: Find HOPE ZIP
        id: archive
        shell: bash
        run: |
          set -Eeuo pipefail

          REQUESTED="${{ inputs.archive }}"

          if [[ -n "$REQUESTED" ]]; then

            if [[ ! -f "$REQUESTED" ]]; then
              echo "::error::ZIP not found: $REQUESTED"
              exit 1
            fi

            SELECTED="$REQUESTED"

          else

            mapfile -t ZIP_FILES < <(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -iname "*.zip" \
                -not -path "$GITHUB_WORKSPACE/.git/*" \
                -not -path "$GITHUB_WORKSPACE/.hope-bootstrap/*" \
                | sort
            )

            if [[ "${#ZIP_FILES[@]}" -eq 0 ]]; then
              echo "::error::No ZIP file found."
              exit 1
            fi

            SELECTED=""

            for FILE in "${ZIP_FILES[@]}"; do
              BASE="$(basename "$FILE")"

              if [[ "$BASE" == *HOPE* || "$BASE" == *hope* ]]; then
                SELECTED="$FILE"
                break
              fi
            done

            if [[ -z "$SELECTED" ]]; then
              SELECTED="${ZIP_FILES[0]}"
            fi

          fi

          echo
          echo "=============================================="
          echo "SELECTED ARCHIVE"
          echo "=============================================="
          echo "$SELECTED"

          echo "archive=$SELECTED" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 5 — VALIDATE ZIP INTEGRITY
      # ============================================================

      - name: Validate ZIP
        shell: bash
        env:
          ZIP: ${{ steps.archive.outputs.archive }}
        run: |
          set -Eeuo pipefail

          echo "Testing ZIP integrity..."

          unzip -t "$ZIP"

          echo
          echo "ZIP integrity: OK"

      # ============================================================
      # 6 — SECURITY CHECK ARCHIVE PATHS
      # ============================================================

      - name: Validate archive paths
        shell: bash
        env:
          ZIP: ${{ steps.archive.outputs.archive }}
        run: |
          set -Eeuo pipefail

          echo "Checking archive paths..."

          while IFS= read -r ENTRY; do

            if [[ "$ENTRY" == /* ]]; then
              echo "::error::Absolute path detected: $ENTRY"
              exit 1
            fi

            if [[ "$ENTRY" =~ ^[A-Za-z]: ]]; then
              echo "::error::Windows absolute path detected: $ENTRY"
              exit 1
            fi

            if [[ "$ENTRY" == ../* ]]; then
              echo "::error::Path traversal detected: $ENTRY"
              exit 1
            fi

            if [[ "$ENTRY" == */../* ]]; then
              echo "::error::Path traversal detected: $ENTRY"
              exit 1
            fi

            if [[ "$ENTRY" == */.. ]]; then
              echo "::error::Path traversal detected: $ENTRY"
              exit 1
            fi

            if [[ "$ENTRY" == ..\\* ]]; then
              echo "::error::Path traversal detected: $ENTRY"
              exit 1
            fi

            if [[ "$ENTRY" == *\\..\\* ]]; then
              echo "::error::Path traversal detected: $ENTRY"
              exit 1
            fi

          done < <(unzip -Z1 "$ZIP")

          echo "Archive path validation: OK"

      # ============================================================
      # 7 — EXTRACT OUTSIDE WORKSPACE
      # ============================================================

      - name: Extract project
        shell: bash
        env:
          ZIP: ${{ steps.archive.outputs.archive }}
        run: |
          set -Eeuo pipefail

          EXTRACT="$STAGING_DIR/extracted"

          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"

          echo "Extracting ZIP:"
          echo "$EXTRACT"

          unzip -q "$ZIP" -d "$EXTRACT"

          echo
          echo "Extraction complete."

          echo
          echo "Top-level extracted content:"
          find "$EXTRACT" \
            -mindepth 1 \
            -maxdepth 2 \
            | sort \
            | head -300

      # ============================================================
      # 8 — DETECT PROJECT ROOT
      # ============================================================

      - name: Detect project root
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail

          EXTRACT="$STAGING_DIR/extracted"

          ROOT="$EXTRACT"

          mapfile -t TOP_DIRS < <(
            find "$EXTRACT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -not -name ".git" \
              | sort
          )

          mapfile -t TOP_FILES < <(
            find "$EXTRACT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type f \
              | sort
          )

          if [[ "${#TOP_FILES[@]}" -eq 0 &&
                "${#TOP_DIRS[@]}" -eq 1 ]]; then

            CANDIDATE="${TOP_DIRS[0]}"

            if [[ \
              -f "$CANDIDATE/pubspec.yaml" ||
              -f "$CANDIDATE/package.json" ||
              -d "$CANDIDATE/.github" ||
              -d "$CANDIDATE/docs"
            ]]; then
              ROOT="$CANDIDATE"
            fi
          fi

          echo
          echo "=============================================="
          echo "PROJECT ROOT"
          echo "=============================================="
          echo "$ROOT"

          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 9 — FIND SUPERPROMPT
      # ============================================================

      - name: Locate SUPERPROMPT
        id: prompt
        shell: bash
        env:
          ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set -Eeuo pipefail

          echo "Searching for HOPE SUPERPROMPT..."

          PROMPT=""

          if [[ -f "$ROOT/docs/roadmap/SUPERPROMPT.md" ]]; then
            PROMPT="$ROOT/docs/roadmap/SUPERPROMPT.md"
          fi

          if [[ -z "$PROMPT" ]]; then

            while IFS= read -r FILE; do

              if grep -qiE \
                "HOPE[[:space:]]+SUPER[-]?PROMPT" \
                "$FILE" \
                2>/dev/null; then

                PROMPT="$FILE"
                break

              fi

            done < <(
              find "$ROOT" \
                -type f \
                \( \
                  -iname "*SUPERPROMPT*.md" \
                  -o \
                  -iname "*SUPER-PROMPT*.md" \
                \) \
                | sort
            )

          fi

          if [[ -z "$PROMPT" ]]; then

            echo "::error::No HOPE SUPERPROMPT found."

            find "$ROOT" \
              -type f \
              -iname "*.md" \
              | sort \
              | grep -iE "prompt|super|roadmap" \
              || true

            exit 1
          fi

          echo
          echo "SUPERPROMPT found:"
          echo "$PROMPT"

          echo "prompt=$PROMPT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 10 — SYNCHRONIZE EXTRACTED PROJECT
      # ============================================================

      - name: Synchronize extracted project
        shell: bash
        env:
          ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set -Eeuo pipefail

          echo "Synchronizing extracted project..."

          rsync -a \
            --delete \
            --exclude ".git/" \
            --exclude ".github/workflows/hope-bootstrap.yml" \
            --exclude ".hope-bootstrap/" \
            "$ROOT/" \
            "$GITHUB_WORKSPACE/"

          echo
          echo "Synchronization complete."

      # ============================================================
      # 11 — VERIFY PROJECT
      # ============================================================

      - name: Verify synchronized project
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Checking project..."

          if [[ ! -d ".git" ]]; then
            echo "::error::.git directory missing."
            exit 1
          fi

          if [[ ! -f "docs/roadmap/SUPERPROMPT.md" ]]; then
            echo "::error::docs/roadmap/SUPERPROMPT.md missing."
            exit 1
          fi

          echo
          echo "Project verification: OK"

          for FILE in \
            "docs/roadmap/SUPERPROMPT.md" \
            "docs/roadmap/MULTI-VERTICAL-ROADMAP.md" \
            "pubspec.yaml" \
            "pubspec.lock" \
            "package.json" \
            "package-lock.json"
          do
            if [[ -e "$FILE" ]]; then
              echo "[OK] $FILE"
            fi
          done

      # ============================================================
      # 12 — PREPARE CODESPACES
      # ============================================================

      - name: Prepare Codespaces configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p .devcontainer

          cat > .devcontainer/devcontainer.json <<'EOF'
          {
            "name": "HOPE Super App",
            "image": "mcr.microsoft.com/devcontainers/base:ubuntu",
            "features": {
              "ghcr.io/devcontainers/features/git:1": {},
              "ghcr.io/devcontainers/features/github-cli:1": {},
              "ghcr.io/devcontainers/features/node:1": {
                "version": "22"
              }
            },
            "customizations": {
              "vscode": {
                "extensions": [
                  "Dart-Code.flutter",
                  "Dart-Code.dart-code",
                  "eamodio.gitlens"
                ]
              }
            },
            "postCreateCommand": "echo 'HOPE Codespace ready'"
          }
          EOF

          echo "Codespaces configuration prepared."

      # ============================================================
      # 13 — CREATE AGENT HANDOFF
      # ============================================================

      - name: Create agent handoff
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p docs/roadmap

          cat > docs/roadmap/AGENT-HANDOFF.md <<'EOF'
          # HOPE Autonomous Agent Handoff

          ## PRIMARY DIRECTIVE

          Before changing anything:

          1. Read `docs/roadmap/SUPERPROMPT.md`.
          2. Read the current STATE.
          3. Read the active session plan.
          4. Inspect the actual repository.
          5. Execute ONLY the current session unless explicitly allowed otherwise.

          ## PRODUCT

          HOPE is evolving from a jobs marketplace into a professional
          multi-vertical marketplace / super-app.

          Existing Jobs functionality MUST NOT be broken.

          ## NON-NEGOTIABLE

          Never invent:
          - APIs
          - database schema
          - authentication behavior
          - payment behavior
          - backend contracts
          - existing business rules

          Inspect the actual implementation first.

          ## ENGINEERING STANDARD

          Changes must be:
          - production-oriented
          - testable
          - maintainable
          - auditable
          - secure
          - responsive
          - accessible
          - localization-ready
          - RTL-aware where appropriate

          ## VERIFICATION

          Before closing the session:

          1. Run formatting.
          2. Run analyzer/linter.
          3. Run relevant tests.
          4. Run build checks when appropriate.
          5. Inspect git diff.
          6. Update STATE.
          7. Document blockers.
          8. Commit a clean checkpoint.

          ## GIT

          Work only on the dedicated session branch.

          Never force-push main/master.

          Do not rewrite unrelated history.

          ## CLOSEOUT

          At the end of the session:

          - update STATE
          - record completed work
          - record verification
          - record blockers
          - record next session
          - leave repository in a recoverable state
          EOF

      # ============================================================
      # 14 — READ CURRENT SESSION
      # ============================================================

      - name: Read current session
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail

          FILE="docs/roadmap/SUPERPROMPT.md"

          SESSION=""

          if grep -qE \
            '^[[:space:]]*current_session:' \
            "$FILE"; then

            SESSION="$(
              grep -E \
                '^[[:space:]]*current_session:' \
                "$FILE" \
                | head -1 \
                | sed -E \
                  's/.*current_session:[[:space:]]*([0-9]+).*/\1/'
            )"

          fi

          [[ -z "$SESSION" ]] && SESSION="0"

          echo
          echo "=============================================="
          echo "CURRENT SESSION"
          echo "=============================================="
          echo "$SESSION"

          echo "current_session=$SESSION" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 15 — SETUP NODE
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
        continue-on-error: true

      # ============================================================
      # 16 — SETUP FLUTTER
      # ============================================================

      - name: Setup Flutter
        if: ${{ hashFiles('pubspec.yaml') != '' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ============================================================
      # 17 — SHOW TOOLCHAIN
      # ============================================================

      - name: Show toolchain
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "TOOLCHAIN"
          echo "=============================================="

          node --version
          npm --version
          git --version

          if command -v flutter >/dev/null 2>&1; then
            flutter --version
          fi

          if command -v dart >/dev/null 2>&1; then
            dart --version
          fi

      # ============================================================
      # 18 — PREPARE DEPENDENCIES
      # ============================================================

      - name: Prepare dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f pubspec.yaml ]]; then
            echo "Flutter dependencies..."
            flutter pub get
          fi

          if [[ -f package.json ]]; then
            echo "Root Node dependencies..."

            if [[ -f package-lock.json ]]; then
              npm ci
            else
              npm install
            fi
          fi

          if [[ -f backend/package.json ]]; then
            echo "Backend Node dependencies..."

            (
              cd backend

              if [[ -f package-lock.json ]]; then
                npm ci
              else
                npm install
              fi
            )
          fi

      # ============================================================
      # 19 — CREATE COPILOT SESSION BRANCH
      # ============================================================

      - name: Create Copilot session branch
        id: branch
        shell: bash
        run: |
          set -Eeuo pipefail

          SESSION="${{ steps.state.outputs.current_session }}"

          [[ "$SESSION" == "0" ]] && SESSION="1"

          BRANCH="copilot/hope-session-${SESSION}"

          git config user.name "HOPE Copilot Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Preparing branch: $BRANCH"

          git fetch origin --prune

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Remote branch already exists; resetting local branch to origin/$BRANCH."

            git fetch origin "$BRANCH"
            git switch -C "$BRANCH" "origin/$BRANCH"
          else
            echo "Creating new branch from current checked-out commit."
            git switch -C "$BRANCH"
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 20 — COMMIT BOOTSTRAP PREPARATION
      # ============================================================

      - name: Commit bootstrap preparation
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "HOPE Copilot Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No bootstrap preparation changes."
          else
            git commit -m "chore(hope): prepare autonomous Copilot workspace"
          fi

      # ============================================================
      # 21 — PUSH BOOTSTRAP BRANCH
      # ============================================================

      - name: Push bootstrap branch
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "PUSH BOOTSTRAP BRANCH"
          echo "=============================================="
          echo "Branch: $BRANCH"

          git push \
            --set-upstream \
            origin \
            "$BRANCH"

          echo
          echo "Bootstrap branch pushed successfully."

      # ============================================================
      # 22 — INSTALL GITHUB COPILOT CLI
      # ============================================================

      - name: Install GitHub Copilot CLI
        if: ${{ inputs.start_agent }}
        shell: bash
        run: |
          set -Eeuo pipefail

          npm install -g @github/copilot

          copilot --version

      # ============================================================
      # 23 — BUILD COPILOT INSTRUCTION
      # ============================================================

      - name: Build Copilot instruction
        if: ${{ inputs.start_agent }}
        env:
          SESSION: ${{ steps.state.outputs.current_session }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          PROMPT: ${{ steps.prompt.outputs.prompt }}
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > /tmp/hope-agent-prompt.md <<EOF
          # HOPE AUTONOMOUS ENGINEERING SESSION

          You are the autonomous implementation agent for the HOPE
          Marketplace -> Multi-Vertical Platform project.

          ============================================================
          AUTHORITATIVE INSTRUCTION
          ============================================================

          Read this completely before implementation:

          docs/roadmap/SUPERPROMPT.md

          Detected SUPERPROMPT:
          $PROMPT

          ============================================================
          CURRENT SESSION
          ============================================================

          Current session:
          $SESSION

          Current branch:
          $BRANCH

          Execute the CURRENT SESSION ONLY.

          ============================================================
          FIRST ACTIONS
          ============================================================

          1. Read docs/roadmap/SUPERPROMPT.md completely.
          2. Read the current STATE.
          3. Read the active session plan.
          4. Read the roadmap.
          5. Inspect repository structure.
          6. Inspect existing Flutter architecture.
          7. Inspect backend architecture.
          8. Inspect database/schema files.
          9. Inspect existing Jobs functionality.
          10. Determine what is real versus placeholder.

          Never rely on assumptions.

          ============================================================
          CORE PRODUCT RULE
          ============================================================

          HOPE is evolving into a professional multi-vertical
          marketplace / super-app.

          Existing Jobs functionality MUST remain functional.

          Snapp may be used only as inspiration for interaction
          patterns and marketplace ergonomics.

          Never copy proprietary implementation, assets, branding,
          trademarks, or pixel-identical screens.

          ============================================================
          ENGINEERING
          ============================================================

          Use the existing project architecture where it is sound.

          Prefer:

          - feature-oriented structure
          - reusable design-system components
          - typed models
          - repositories/services
          - explicit state management
          - dependency injection when justified
          - centralized navigation
          - centralized error handling
          - localization
          - design tokens
          - accessibility semantics
          - responsive breakpoints

          Every meaningful screen should handle:

          - loading
          - success
          - empty
          - error
          - retry
          - disabled
          - validation
          - accessibility
          - responsive layouts
          - RTL where applicable
          - localization readiness

          Do not create decorative fake UI.

          ============================================================
          BACKEND
          ============================================================

          Never invent:

          - API endpoints
          - database fields
          - auth semantics
          - payment semantics
          - permissions
          - undocumented business rules

          Inspect actual implementation first.

          Preserve backward compatibility unless the session explicitly
          defines a migration.

          ============================================================
          SECURITY
          ============================================================

          Never weaken:

          - authentication
          - authorization
          - validation
          - rate limiting
          - secure storage
          - secret handling
          - transport security
          - audit logging

          Never hardcode secrets.

          Never commit credentials.

          Never disable security controls merely to make a build pass.

          ============================================================
          DEPENDENCIES
          ============================================================

          Reuse existing dependencies whenever practical.

          Do not add dependencies without justification.

          ============================================================
          VERIFICATION
          ============================================================

          For Flutter:

          - dart format
          - flutter analyze
          - relevant flutter test
          - build checks when appropriate

          For Node/backend:

          - npm test when available
          - npm run lint when available
          - npm run build when available

          Never claim success for a command that was not actually run.

          ============================================================
          GIT
          ============================================================

          Work only on:

          $BRANCH

          Never force-push main/master.

          Do not rewrite unrelated history.

          Inspect:

          git status
          git diff
          git diff --check

          before closeout.

          ============================================================
          CLOSEOUT
          ============================================================

          Before finishing:

          1. Complete current session.
          2. Verify work.
          3. Update STATE.
          4. Record completed work.
          5. Record files changed.
          6. Record verification.
          7. Record blockers and risks.
          8. Record next session.
          9. Commit a clean checkpoint.

          Never fake completion.

          Never mark incomplete work as complete.

          Start by reading SUPERPROMPT and STATE now.
          EOF

          echo "Copilot instruction created."

      # ============================================================
      # 24 — RUN COPILOT AUTOPILOT
      # ============================================================

      - name: Run HOPE with GitHub Copilot Autopilot
        if: ${{ inputs.start_agent }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAX_CONTINUES: ${{ inputs.max_autopilot_continues }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "GITHUB COPILOT AUTOPILOT"
          echo "=============================================="

          copilot --version

          echo
          echo "Maximum autonomous continuations:"
          echo "$MAX_CONTINUES"

          echo
          echo "Starting autonomous HOPE session..."

          copilot \
            --autopilot \
            --yolo \
            --no-banner \
            --max-autopilot-continues "$MAX_CONTINUES" \
            -p "$(cat /tmp/hope-agent-prompt.md)"

          echo
          echo "Copilot Autopilot process finished."

      # ============================================================
      # 25 — POST-AGENT VERIFICATION
      # ============================================================

      - name: Verify agent output
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "POST-AGENT CHECK"
          echo "=============================================="

          echo
          echo "Git status:"
          git status --short

          echo
          echo "Recent commits:"
          git --no-pager log --oneline --decorate -15

          echo
          echo "SUPERPROMPT:"
          [[ -f docs/roadmap/SUPERPROMPT.md ]] \
            && echo "YES" \
            || {
              echo "NO"
              echo "::error::SUPERPROMPT disappeared."
              exit 1
            }

          echo
          echo "STATE candidates:"

          find docs \
            -type f \
            \( \
              -iname "*STATE*.yml" \
              -o \
              -iname "*STATE*.yaml" \
              -o \
              -iname "*STATE*.md" \
            \) \
            | sort \
            | head -100 \
            || true

      # ============================================================
      # 26 — VERIFY DIFF
      # ============================================================

      - name: Verify Git diff
        shell: bash
        run: |
          set -Eeuo pipefail

          git diff --check

          echo
          echo "Diff summary:"
          git diff --stat

          echo
          echo "Git diff check: OK"

      # ============================================================
      # 27 — FLUTTER VERIFICATION
      # ============================================================

      - name: Verify Flutter project
        if: ${{ hashFiles('pubspec.yaml') != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          flutter pub get

          dart format \
            --output=none \
            --set-exit-if-changed \
            lib test

          flutter analyze

          if [[ -d test ]]; then
            flutter test
          fi

          echo
          echo "Flutter verification completed."

      # ============================================================
      # 28 — ROOT NODE VERIFICATION
      # ============================================================

      - name: Verify Node project
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Running root Node verification..."

          if npm run | grep -qE '^[[:space:]]+lint'; then
            npm run lint
          fi

          if npm run | grep -qE '^[[:space:]]+test'; then
            npm test
          fi

          if npm run | grep -qE '^[[:space:]]+build'; then
            npm run build
          fi

          echo
          echo "Root Node verification completed."

      # ============================================================
      # 29 — BACKEND VERIFICATION
      # ============================================================

      - name: Verify backend project
        if: ${{ hashFiles('backend/package.json') != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          cd backend

          if npm run | grep -qE '^[[:space:]]+lint'; then
            npm run lint
          fi

          if npm run | grep -qE '^[[:space:]]+test'; then
            npm test
          fi

          if npm run | grep -qE '^[[:space:]]+build'; then
            npm run build
          fi

          echo
          echo "Backend verification completed."

      # ============================================================
      # 30 — FINAL GIT STATUS
      # ============================================================

      - name: Final repository status
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "FINAL REPOSITORY STATUS"
          echo "=============================================="

          git status --short

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Recent commits:"
          git --no-pager log --oneline --decorate -10

          echo
          echo "Changed files:"
          git diff --name-status || true

      # ============================================================
      # 31 — COMMIT FINAL AGENT CHANGES
      # ============================================================

      - name: Commit final agent changes
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "HOPE Copilot Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No uncommitted changes after agent execution."
          else
            git commit -m "feat(hope): complete autonomous session"
          fi

      # ============================================================
      # 32 — PUSH FINAL AGENT CHANGES
      # ============================================================

      - name: Push final agent changes
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "PUSH FINAL AGENT CHANGES"
          echo "=============================================="
          echo "Branch: $BRANCH"

          git push \
            --set-upstream \
            origin \
            "$BRANCH"

          echo
          echo "Final agent changes pushed successfully."

      # ============================================================
      # 33 — FINAL SUMMARY
      # ============================================================

      - name: Final summary
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          SESSION: ${{ steps.state.outputs.current_session }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "============================================================"
          echo "HOPE BOOTSTRAP COMPLETE"
          echo "============================================================"
          echo
          echo "Repository:"
          echo "  $GITHUB_REPOSITORY"
          echo
          echo "Session:"
          echo "  $SESSION"
          echo
          echo "Branch:"
          echo "  $BRANCH"
          echo
          echo "SUPERPROMPT:"
          echo "  docs/roadmap/SUPERPROMPT.md"
          echo
          echo "Copilot:"
          if [[ "${{ inputs.start_agent }}" == "true" ]]; then
            echo "  AUTOPILOT EXECUTED"
          else
            echo "  DISABLED"
          fi
          echo
          echo "============================================================"
