name: HOPE Bootstrap → ZIP → Prepare → Copilot Autopilot

on:
  workflow_dispatch:
    inputs:
      archive:
        description: "ZIP filename in repository. Leave empty to auto-detect."
        required: false
        type: string
        default: ""

      start_agent:
        description: "Start GitHub Copilot automatically."
        required: false
        type: boolean
        default: true

      max_autopilot_continues:
        description: "Maximum Copilot autonomous continuations."
        required: false
        type: number
        default: 12

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: hope-bootstrap-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGING_DIR: /tmp/hope-bootstrap
  REPO_DIR: ${{ github.workspace }}

jobs:
  bootstrap:
    name: Bootstrap HOPE
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:

      # ============================================================
      # 1 — CHECKOUT USING PAT WITH WORKFLOW WRITE PERMISSION
      # ============================================================

      - name: Validate bootstrap token
        shell: bash
        env:
          HOPE_BOOTSTRAP_TOKEN: ${{ secrets.HOPE_BOOTSTRAP_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${HOPE_BOOTSTRAP_TOKEN:-}" ]]; then
            echo "::error::Missing repository secret HOPE_BOOTSTRAP_TOKEN."
            echo
            echo "Create a Fine-grained Personal Access Token with:"
            echo "  Contents  -> Read and write"
            echo "  Workflows -> Read and write"
            echo
            echo "Then save it as:"
            echo "  HOPE_BOOTSTRAP_TOKEN"
            exit 1
          fi

          echo "HOPE_BOOTSTRAP_TOKEN is configured."

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.HOPE_BOOTSTRAP_TOKEN }}

      # ============================================================
      # 2 — INITIALIZE
      # ============================================================

      - name: Initialize bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "HOPE BOOTSTRAP"
          echo "=============================================="
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Branch     : $GITHUB_REF_NAME"
          echo "Commit     : $GITHUB_SHA"
          echo "Workspace  : $GITHUB_WORKSPACE"
          echo "Runner     : $RUNNER_OS"
          echo

          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"

          git status --short
          git branch --show-current

      # ============================================================
      # 3 — VERIFY GIT AUTHENTICATION
      # ============================================================

      - name: Verify Git authentication
        shell: bash
        env:
          HOPE_BOOTSTRAP_TOKEN: ${{ secrets.HOPE_BOOTSTRAP_TOKEN }}
        run: |
          set -Eeuo pipefail

          echo "Checking authenticated Git remote..."

          git remote -v

          echo
          echo "Testing authenticated repository access..."

          git ls-remote origin HEAD >/dev/null

          echo "Git authentication: OK"

      # ============================================================
      # 4 — FIND ZIP
      # ============================================================

      - name: Find HOPE ZIP
        id: archive
        shell: bash
        run: |
          set -Eeuo pipefail

          REQUESTED="${{ inputs.archive }}"

          if [[ -n "$REQUESTED" ]]; then

            if [[ ! -f "$REQUESTED" ]]; then
              echo "::error::ZIP not found: $REQUESTED"
              exit 1
            fi

            SELECTED="$REQUESTED"

          else

            mapfile -t ZIP_FILES < <(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -iname "*.zip" \
                -not -path "$GITHUB_WORKSPACE/.git/*" \
                -not -path "$GITHUB_WORKSPACE/.hope-bootstrap/*" \
                | sort
            )

            if [[ "${#ZIP_FILES[@]}" -eq 0 ]]; then
              echo "::error::No ZIP file found."
              exit 1
            fi

            SELECTED=""

            # Prefer HOPE-named archives.
            for FILE in "${ZIP_FILES[@]}"; do
              BASE="$(basename "$FILE")"

              if [[ "$BASE" == *HOPE* || "$BASE" == *hope* ]]; then
                SELECTED="$FILE"
                break
              fi
            done

            # Fallback to first ZIP.
            if [[ -z "$SELECTED" ]]; then
              SELECTED="${ZIP_FILES[0]}"
            fi

          fi

          echo
          echo "=============================================="
          echo "SELECTED ARCHIVE"
          echo "=============================================="
          echo "$SELECTED"
          echo

          echo "archive=$SELECTED" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 5 — VALIDATE ZIP INTEGRITY
      # ============================================================

      - name: Validate ZIP
        shell: bash
        env:
          ZIP: ${{ steps.archive.outputs.archive }}
        run: |
          set -Eeuo pipefail

          echo "Testing ZIP integrity..."

          unzip -t "$ZIP"

          echo
          echo "ZIP integrity: OK"

      # ============================================================
      # 6 — SECURITY CHECK ARCHIVE PATHS
      # ============================================================

      - name: Validate archive paths
        shell: bash
        env:
          ZIP: ${{ steps.archive.outputs.archive }}
        run: |
          set -Eeuo pipefail

          echo "Checking archive paths..."

          while IFS= read -r ENTRY; do

            # Absolute Unix path.
            if [[ "$ENTRY" == /* ]]; then
              echo "::error::Absolute path detected: $ENTRY"
              exit 1
            fi

            # Windows drive path.
            if [[ "$ENTRY" =~ ^[A-Za-z]: ]]; then
              echo "::error::Windows absolute path detected: $ENTRY"
              exit 1
            fi

            # Traversal.
            if [[ "$ENTRY" == ../* ]]; then
              echo "::error::Path traversal detected: $ENTRY"
              exit 1
            fi

            if [[ "$ENTRY" == */../* ]]; then
              echo "::error::Path traversal detected: $ENTRY"
              exit 1
            fi

            if [[ "$ENTRY" == */.. ]]; then
              echo "::error::Path traversal detected: $ENTRY"
              exit 1
            fi

            # Backslash traversal.
            if [[ "$ENTRY" == ..\\* ]]; then
              echo "::error::Path traversal detected: $ENTRY"
              exit 1
            fi

            if [[ "$ENTRY" == *\\..\\* ]]; then
              echo "::error::Path traversal detected: $ENTRY"
              exit 1
            fi

          done < <(unzip -Z1 "$ZIP")

          echo "Archive path validation: OK"

      # ============================================================
      # 7 — EXTRACT OUTSIDE GITHUB WORKSPACE
      # ============================================================

      - name: Extract project
        shell: bash
        env:
          ZIP: ${{ steps.archive.outputs.archive }}
        run: |
          set -Eeuo pipefail

          EXTRACT="$STAGING_DIR/extracted"

          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"

          echo "Extracting ZIP outside GitHub workspace:"
          echo "$EXTRACT"

          unzip -q "$ZIP" -d "$EXTRACT"

          echo
          echo "Extraction complete."

          echo
          echo "Top-level extracted content:"
          find "$EXTRACT" \
            -mindepth 1 \
            -maxdepth 2 \
            | sort \
            | head -300

      # ============================================================
      # 8 — DETECT PROJECT ROOT
      # ============================================================

      - name: Detect project root
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail

          EXTRACT="$STAGING_DIR/extracted"

          ROOT="$EXTRACT"

          mapfile -t TOP_DIRS < <(
            find "$EXTRACT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -not -name ".git" \
              | sort
          )

          mapfile -t TOP_FILES < <(
            find "$EXTRACT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type f \
              | sort
          )

          # Handle ZIPs with a single wrapper directory.
          if [[ "${#TOP_FILES[@]}" -eq 0 &&
                "${#TOP_DIRS[@]}" -eq 1 ]]; then

            CANDIDATE="${TOP_DIRS[0]}"

            if [[ \
              -f "$CANDIDATE/pubspec.yaml" ||
              -f "$CANDIDATE/package.json" ||
              -d "$CANDIDATE/.github" ||
              -d "$CANDIDATE/docs"
            ]]; then

              ROOT="$CANDIDATE"

            fi
          fi

          echo
          echo "=============================================="
          echo "PROJECT ROOT"
          echo "=============================================="
          echo "$ROOT"

          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 9 — FIND SUPERPROMPT
      # ============================================================

      - name: Locate SUPERPROMPT
        id: prompt
        shell: bash
        env:
          ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set -Eeuo pipefail

          echo "Searching for HOPE SUPERPROMPT..."

          PROMPT=""

          # Preferred canonical location.
          if [[ -f "$ROOT/docs/roadmap/SUPERPROMPT.md" ]]; then
            PROMPT="$ROOT/docs/roadmap/SUPERPROMPT.md"
          fi

          # Search by filename/content.
          if [[ -z "$PROMPT" ]]; then

            while IFS= read -r FILE; do

              if grep -qiE \
                "HOPE[[:space:]]+SUPER[-]?PROMPT" \
                "$FILE" \
                2>/dev/null; then

                PROMPT="$FILE"
                break

              fi

            done < <(
              find "$ROOT" \
                -type f \
                \( \
                  -iname "*SUPERPROMPT*.md" \
                  -o \
                  -iname "*SUPER-PROMPT*.md" \
                \) \
                | sort
            )

          fi

          if [[ -z "$PROMPT" ]]; then

            echo "::error::No HOPE SUPERPROMPT found."

            echo
            echo "Possible prompt files:"
            find "$ROOT" \
              -type f \
              -iname "*.md" \
              | sort \
              | grep -iE \
                "prompt|super|roadmap" \
              || true

            exit 1
          fi

          echo
          echo "SUPERPROMPT found:"
          echo "$PROMPT"

          echo "prompt=$PROMPT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 10 — SYNCHRONIZE EXTRACTED PROJECT SAFELY
      # ============================================================

      - name: Synchronize extracted project
        shell: bash
        env:
          ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set -Eeuo pipefail

          echo "Synchronizing extracted project..."

          # CRITICAL:
          #
          # ROOT lives in /tmp.
          # Destination is GITHUB_WORKSPACE.
          #
          # This prevents rsync --delete from deleting
          # its own source tree.

          rsync -a \
            --delete \
            --exclude ".git/" \
            --exclude ".github/workflows/hope-bootstrap.yml" \
            --exclude ".hope-bootstrap/" \
            "$ROOT/" \
            "$GITHUB_WORKSPACE/"

          echo
          echo "Synchronization complete."

      # ============================================================
      # 11 — VERIFY PROJECT
      # ============================================================

      - name: Verify synchronized project
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Checking project..."

          if [[ ! -d ".git" ]]; then
            echo "::error::.git directory missing."
            exit 1
          fi

          if [[ ! -f "docs/roadmap/SUPERPROMPT.md" ]]; then
            echo "::error::docs/roadmap/SUPERPROMPT.md missing."
            exit 1
          fi

          echo
          echo "Project verification: OK"

          echo
          echo "Important files:"
          for FILE in \
            "docs/roadmap/SUPERPROMPT.md" \
            "docs/roadmap/MULTI-VERTICAL-ROADMAP.md" \
            "pubspec.yaml" \
            "pubspec.lock" \
            "package.json" \
            "package-lock.json"
          do
            if [[ -e "$FILE" ]]; then
              echo "  [OK] $FILE"
            fi
          done

      # ============================================================
      # 12 — PREPARE CODESPACES
      # ============================================================

      - name: Prepare Codespaces configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p .devcontainer

          cat > .devcontainer/devcontainer.json <<'EOF'
          {
            "name": "HOPE Super App",
            "image": "mcr.microsoft.com/devcontainers/base:ubuntu",
            "features": {
              "ghcr.io/devcontainers/features/git:1": {},
              "ghcr.io/devcontainers/features/github-cli:1": {},
              "ghcr.io/devcontainers/features/node:1": {
                "version": "22"
              }
            },
            "customizations": {
              "vscode": {
                "extensions": [
                  "Dart-Code.flutter",
                  "Dart-Code.dart-code",
                  "eamodio.gitlens"
                ]
              }
            },
            "postCreateCommand": "echo 'HOPE Codespace ready'"
          }
          EOF

          echo "Codespaces configuration prepared."

      # ============================================================
      # 13 — CREATE AGENT HANDOFF
      # ============================================================

      - name: Create agent handoff
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p docs/roadmap

          cat > docs/roadmap/AGENT-HANDOFF.md <<'EOF'
          # HOPE Autonomous Agent Handoff

          ## PRIMARY DIRECTIVE

          Before changing anything:

          1. Read `docs/roadmap/SUPERPROMPT.md`.
          2. Read the current STATE.
          3. Read the active session plan.
          4. Inspect the actual repository.
          5. Execute ONLY the current session unless the SUPERPROMPT explicitly allows otherwise.

          ## PRODUCT

          HOPE is evolving from a jobs marketplace into a professional
          multi-vertical marketplace / super-app.

          The UX quality target is comparable to mature consumer
          super-apps and marketplaces.

          Snapp may be used only as inspiration for product patterns.

          Never copy:
          - proprietary source code
          - proprietary assets
          - trademarks
          - branding
          - pixel-identical screens

          ## NON-NEGOTIABLE

          Existing Jobs functionality MUST NOT be broken.

          Never invent:
          - APIs
          - database schema
          - authentication behavior
          - payment behavior
          - backend contracts
          - existing business rules

          Inspect the actual code and schema first.

          ## ENGINEERING STANDARD

          Changes must be:
          - production-oriented
          - testable
          - maintainable
          - auditable
          - secure
          - responsive
          - accessible
          - localization-ready
          - RTL-aware where appropriate

          ## FLUTTER

          Prefer:
          - clear feature boundaries
          - reusable widgets
          - design tokens
          - typed models
          - explicit state management
          - repository/service separation
          - loading/error/empty states
          - responsive layouts
          - accessibility semantics

          Do not create fake UI that is disconnected from real data.

          ## BACKEND

          Backend changes must preserve:
          - existing API contracts
          - validation
          - authorization
          - error semantics
          - migrations
          - indexes
          - auditability

          ## VERIFICATION

          Before closing the session:

          1. Run relevant formatting.
          2. Run analyzer/linter.
          3. Run relevant unit tests.
          4. Run integration/contract tests when available.
          5. Run build checks when appropriate.
          6. Inspect git diff.
          7. Update STATE.
          8. Document important decisions.
          9. Commit a clean checkpoint.

          ## SESSION DISCIPLINE

          Do not silently skip required work.

          If a dependency/network/tooling problem prevents verification,
          record the exact blocker in STATE rather than pretending success.

          ## GIT

          Work on the dedicated session branch.

          Never force-push main/master.

          Do not rewrite unrelated history.

          ## CLOSEOUT

          At the end of the session:

          - update STATE
          - record completed work
          - record verification
          - record blockers
          - record next session
          - leave repository in a recoverable state
          EOF

      # ============================================================
      # 14 — READ CURRENT SESSION
      # ============================================================

      - name: Read current session
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail

          FILE="docs/roadmap/SUPERPROMPT.md"

          SESSION=""

          if grep -qE \
            '^[[:space:]]*current_session:' \
            "$FILE"; then

            SESSION="$(
              grep -E \
                '^[[:space:]]*current_session:' \
                "$FILE" \
                | head -1 \
                | sed -E \
                  's/.*current_session:[[:space:]]*([0-9]+).*/\1/'
            )"

          fi

          if [[ -z "$SESSION" ]]; then
            SESSION="0"
          fi

          echo
          echo "=============================================="
          echo "CURRENT SESSION"
          echo "=============================================="
          echo "$SESSION"

          echo "current_session=$SESSION" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 15 — SETUP NODE
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # ============================================================
      # 16 — SETUP FLUTTER
      # ============================================================

      - name: Setup Flutter
        if: ${{ hashFiles('pubspec.yaml') != '' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ============================================================
      # 17 — SHOW TOOLCHAIN
      # ============================================================

      - name: Show toolchain
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "TOOLCHAIN"
          echo "=============================================="

          node --version
          npm --version
          git --version

          if command -v flutter >/dev/null 2>&1; then
            flutter --version
          fi

          if command -v dart >/dev/null 2>&1; then
            dart --version
          fi

      # ============================================================
      # 18 — PREPARE DEPENDENCIES
      # ============================================================

      - name: Prepare dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Preparing dependencies..."

          if [[ -f pubspec.yaml ]]; then
            echo
            echo "Flutter dependencies..."
            flutter pub get
          fi

          if [[ -f package.json ]]; then
            echo
            echo "Root Node dependencies..."

            if [[ -f package-lock.json ]]; then
              npm ci
            else
              npm install
            fi
          fi

          if [[ -f backend/package.json ]]; then
            echo
            echo "Backend Node dependencies..."

            (
              cd backend

              if [[ -f package-lock.json ]]; then
                npm ci
              else
                npm install
              fi
            )
          fi

      # ============================================================
      # 19 — CREATE COPILOT SESSION BRANCH
      # ============================================================

      - name: Create Copilot session branch
        id: branch
        shell: bash
        run: |
          set -Eeuo pipefail

          SESSION="${{ steps.state.outputs.current_session }}"

          if [[ "$SESSION" == "0" ]]; then
            SESSION="1"
          fi

          BRANCH="copilot/hope-session-${SESSION}"

          echo "Creating branch:"
          echo "$BRANCH"

          git config user.name "HOPE Copilot Agent"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin \
            "+refs/heads/*:refs/remotes/origin/*" \
            --prune

          git switch -C "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 20 — COMMIT BOOTSTRAP PREPARATION
      # ============================================================

      - name: Commit bootstrap preparation
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "HOPE Copilot Agent"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then

            echo "No bootstrap preparation changes."

          else

            git commit \
              -m "chore(hope): prepare autonomous Copilot workspace"

          fi

      # ============================================================
      # 21 — PUSH BOOTSTRAP BRANCH USING PAT
      # ============================================================

      - name: Push bootstrap branch
        shell: bash
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "PUSH BOOTSTRAP BRANCH"
          echo "=============================================="
          echo "Branch: $BRANCH"
          echo

          # The checkout action authenticated Git using
          # HOPE_BOOTSTRAP_TOKEN.
          #
          # That token MUST have:
          #
          # Contents  -> Read and write
          # Workflows -> Read and write

          git push \
            --set-upstream \
            origin \
            "$BRANCH"

          echo
          echo "Bootstrap branch pushed successfully."

      # ============================================================
      # 22 — INSTALL GITHUB COPILOT CLI
      # ============================================================

      - name: Install GitHub Copilot CLI
        if: ${{ inputs.start_agent }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Installing GitHub Copilot CLI..."

          npm install -g @github/copilot

          echo
          copilot --version

      # ============================================================
      # 23 — BUILD AUTONOMOUS AGENT INSTRUCTION
      # ============================================================

      - name: Build Copilot instruction
        if: ${{ inputs.start_agent }}
        shell: bash
        env:
          SESSION: ${{ steps.state.outputs.current_session }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          PROMPT: ${{ steps.prompt.outputs.prompt }}
        run: |
          set -Eeuo pipefail

          cat > /tmp/hope-agent-prompt.md <<EOF
          # HOPE AUTONOMOUS ENGINEERING SESSION

          You are the autonomous implementation agent for the HOPE
          Marketplace -> Multi-Vertical Platform project.

          ============================================================
          AUTHORITATIVE INSTRUCTION
          ============================================================

          The authoritative project instruction is:

          docs/roadmap/SUPERPROMPT.md

          READ IT COMPLETELY before making implementation decisions.

          Detected SUPERPROMPT source:
          $PROMPT

          ============================================================
          CURRENT SESSION
          ============================================================

          Current session:
          $SESSION

          Current branch:
          $BRANCH

          Execute the current session only.

          Do not jump ahead to unrelated sessions.

          ============================================================
          FIRST ACTIONS
          ============================================================

          1. Read docs/roadmap/SUPERPROMPT.md
          2. Read the current STATE.
          3. Read the current session plan.
          4. Read the roadmap.
          5. Inspect the actual repository structure.
          6. Inspect existing Flutter architecture.
          7. Inspect backend architecture.
          8. Inspect database/schema files.
          9. Inspect existing Jobs functionality.
          10. Determine what is genuinely implemented versus placeholder.

          Do NOT rely on assumptions.

          ============================================================
          CORE PRODUCT RULE
          ============================================================

          HOPE is being evolved into a professional multi-vertical
          marketplace / super-app.

          Preserve the existing Jobs vertical.

          Jobs must remain functional unless the current session
          explicitly concerns a safe migration/refactor of Jobs.

          Never remove working Jobs functionality merely to simplify
          architecture.

          ============================================================
          UX / UI STANDARD
          ============================================================

          Build professional consumer-grade UX.

          Use mature super-app patterns as inspiration.

          Snapp can be considered inspiration for interaction patterns,
          information architecture and marketplace ergonomics only.

          NEVER copy:
          - proprietary source code
          - proprietary assets
          - trademarks
          - branding
          - pixel-identical screens

          The result must have its own HOPE visual identity.

          Every meaningful screen should account for:

          - loading
          - success
          - empty
          - error
          - retry
          - disabled
          - validation
          - accessibility
          - responsive layout
          - RTL where applicable
          - localization readiness

          Avoid decorative fake UI.

          UI must connect to real application state and real backend
          contracts when those contracts exist.

          ============================================================
          FLUTTER ENGINEERING
          ============================================================

          Use professional Flutter architecture.

          Prefer:

          - feature-oriented organization
          - reusable design-system components
          - typed domain models
          - repositories/services
          - explicit state management
          - dependency injection where appropriate
          - centralized navigation
          - centralized error handling
          - centralized localization
          - theme/design tokens
          - accessibility semantics
          - responsive breakpoints

          Do not introduce unnecessary frameworks.

          Reuse existing project architecture when it is sound.

          Refactor only when justified by the current session.

          ============================================================
          BACKEND ENGINEERING
          ============================================================

          Backend changes must be based on actual repository code.

          Never invent:

          - database fields
          - endpoints
          - authentication semantics
          - payment semantics
          - permissions
          - business rules

          Inspect existing:

          - schema
          - migrations
          - controllers
          - services
          - repositories
          - validators
          - middleware
          - error contracts
          - tests

          Preserve backward compatibility unless the session explicitly
          defines a migration.

          ============================================================
          DEPENDENCY HYGIENE
          ============================================================

          Inspect existing dependencies before adding new ones.

          Prefer existing packages.

          Do not add dependencies merely because they are convenient.

          When upgrading dependencies:

          - inspect compatibility
          - update lockfiles
          - run analyzer/linter
          - run tests
          - document breaking changes
          - avoid unnecessary mass upgrades

          ============================================================
          SECURITY
          ============================================================

          Never weaken:

          - authentication
          - authorization
          - input validation
          - rate limiting
          - secure storage
          - secret handling
          - transport security
          - audit logging

          Never hardcode secrets.

          Never commit credentials.

          Never disable security controls simply to make a build pass.

          ============================================================
          VERIFICATION
          ============================================================

          Verify every meaningful change.

          For Flutter:

          - dart format
          - flutter analyze
          - relevant flutter test
          - build checks when appropriate

          For Node/backend:

          - npm test where available
          - npm run lint where available
          - npm run build where available
          - migration/schema validation where available

          Run targeted tests first, then broader tests where practical.

          If a verification step cannot run because of an environmental
          blocker, record the exact blocker.

          NEVER claim a test passed if it was not actually executed.

          ============================================================
          GIT DISCIPLINE
          ============================================================

          Work only on:

          $BRANCH

          Never push directly to main/master.

          Do not rewrite unrelated history.

          Keep commits logical.

          Inspect:

          git status
          git diff
          git diff --check

          before closeout.

          ============================================================
          STATE / CLOSEOUT
          ============================================================

          Before finishing the session:

          1. Complete the planned session work.
          2. Verify it.
          3. Update STATE.
          4. Record:
             - completed work
             - files/components changed
             - verification performed
             - known blockers
             - risks
             - next session
          5. Update roadmap/session documentation if required.
          6. Commit the completed work.
          7. Leave a clean/recoverable checkpoint.

          Do not mark incomplete work as complete.

          ============================================================
          AUTONOMOUS BEHAVIOR
          ============================================================

          You are expected to investigate, implement, test, debug and
          improve the project autonomously.

          Do not stop merely because a small issue appears.

          Diagnose and fix reasonable implementation failures yourself.

          However, do not invent requirements that are not supported by
          the SUPERPROMPT, roadmap or actual repository.

          If the current session cannot safely continue, preserve the
          repository and document the blocker in STATE.

          ============================================================
          FINAL OBJECTIVE
          ============================================================

          Deliver the strongest production-quality implementation of
          the CURRENT SESSION while preserving existing functionality.

          Do not fake completion.

          Do not merely create documentation when implementation is
          required.

          Do not merely create UI without real application integration
          when integration is part of the session.

          Start by reading the SUPERPROMPT and STATE now.
          EOF

          echo "Autonomous Copilot instruction created."

      # ============================================================
      # 24 — RUN GITHUB COPILOT AUTOPILOT
      # ============================================================

      - name: Run HOPE with GitHub Copilot Autopilot
        if: ${{ inputs.start_agent }}
        env:
          # For personal repositories GitHub documents
          # COPILOT_GITHUB_TOKEN authentication.
          #
          # The same token must have the necessary Copilot Requests
          # permission in addition to repository write permissions.
          COPILOT_GITHUB_TOKEN: ${{ secrets.HOPE_BOOTSTRAP_TOKEN }}

          # GitHub CLI / GitHub tooling.
          GH_TOKEN: ${{ secrets.HOPE_BOOTSTRAP_TOKEN }}

          # Also expose GITHUB_TOKEN for tools that expect it.
          GITHUB_TOKEN: ${{ secrets.HOPE_BOOTSTRAP_TOKEN }}

          MAX_CONTINUES: ${{ inputs.max_autopilot_continues }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "GITHUB COPILOT AUTOPILOT"
          echo "=============================================="

          echo
          echo "Copilot version:"
          copilot --version

          echo
          echo "Maximum autonomous continuations:"
          echo "$MAX_CONTINUES"

          echo
          echo "Starting autonomous HOPE session..."

          copilot \
            --autopilot \
            --allow-all \
            --no-ask-user \
            --max-autopilot-continues "$MAX_CONTINUES" \
            -p "$(cat /tmp/hope-agent-prompt.md)"

          echo
          echo "Copilot Autopilot process finished."

      # ============================================================
      # 25 — POST-AGENT VERIFICATION
      # ============================================================

      - name: Verify agent output
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "=============================================="
          echo "POST-AGENT CHECK"
          echo "=============================================="

          echo
          echo "Git status:"
          git status --short

          echo
          echo "Recent commits:"
          git --no-pager log \
            --oneline \
            --decorate \
            -15

          echo
          echo "SUPERPROMPT:"
          if [[ -f docs/roadmap/SUPERPROMPT.md ]]; then
            echo "YES"
          else
            echo "NO"
            echo "::error::SUPERPROMPT disappeared."
            exit 1
          fi

          echo
          echo "STATE candidates:"

          find docs \
            -type f \
            \( \
              -iname "*STATE*.yml" \
              -o \
              -iname "*STATE*.yaml" \
              -o \
              -iname "*STATE*.md" \
            \) \
            | sort \
            | head -100 \
            || true

      # ============================================================
      # 26 — VERIFY DIFF
      # ============================================================

      - name: Verify Git diff
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Checking Git diff..."

          git diff --check

          echo
          echo "Diff summary:"
          git diff --stat

          echo
          echo "Git diff check: OK"

      # ============================================================
      # 27 — RUN FLUTTER VERIFICATION
      # ============================================================

      - name: Verify Flutter project
        if: ${{ hashFiles('pubspec.yaml') != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Running Flutter verification..."

          flutter pub get

          dart format --output=none --set-exit-if-changed \
            lib test \
            2>/dev/null \
            || true

          flutter analyze

          if [[ -d test ]]; then
            flutter test
          fi

          echo
          echo "Flutter verification completed."

      # ============================================================
      # 28 — RUN NODE VERIFICATION
      # ============================================================

      - name: Verify Node project
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Running root Node verification..."

          if npm run | grep -qE \
            '^[[:space:]]+lint'; then
            npm run lint
          fi

          if npm run | grep -qE \
            '^[[:space:]]+test'; then
            npm test
          fi

          if npm run | grep -qE \
            '^[[:space:]]+build'; then
            npm run build
          fi

          echo
          echo "Root Node verification completed."

      # ============================================================
      # 29 — RUN BACKEND VERIFICATION
      # ============================================================

      - name: Verify backend project
        if: ${{ hashFiles('backend/package.json') != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Running backend verification..."

          cd backend

          if npm run | grep -qE \
            '^[[:space:]]+lint'; then
            npm run lint
          fi

          if npm run | grep -qE \
            '^[[:space:]]+test'; then
            npm test
          fi

          if npm run | grep -qE \
            '^[[:space:]]+build'; then
            npm run build
          fi

          echo
          echo "Backend verification completed."

      # ============================================================
      # 30 — FINAL GIT STATUS
      # ============================================================

      - name: Final repository status
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "=============================================="
          echo "FINAL REPOSITORY STATUS"
          echo "=============================================="

          git status --short

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Recent commits:"
          git --no-pager log \
            --oneline \
            --decorate \
            -10

          echo
          echo "Changed files:"
          git diff --name-status || true

      # ============================================================
      # 31 — COMMIT FINAL AGENT CHANGES
      # ============================================================

      - name: Commit final agent changes
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "HOPE Copilot Agent"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then

            echo "No uncommitted changes after agent execution."

          else

            git commit \
              -m "feat(hope): complete autonomous session"

          fi

      # ============================================================
      # 32 — PUSH FINAL AGENT CHANGES
      # ============================================================

      - name: Push final agent changes
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "PUSH FINAL AGENT CHANGES"
          echo "=============================================="
          echo "Branch: $BRANCH"

          git push \
            --set-upstream \
            origin \
            "$BRANCH"

          echo
          echo "Final agent changes pushed successfully."

      # ============================================================
      # 33 — FINAL SUMMARY
      # ============================================================

      - name: Final summary
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          SESSION: ${{ steps.state.outputs.current_session }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "============================================================"
          echo "HOPE BOOTSTRAP COMPLETE"
          echo "============================================================"
          echo
          echo "Repository:"
          echo "  $GITHUB_REPOSITORY"
          echo
          echo "Session:"
          echo "  $SESSION"
          echo
          echo "Branch:"
          echo "  $BRANCH"
          echo
          echo "SUPERPROMPT:"
          echo "  docs/roadmap/SUPERPROMPT.md"
          echo
          echo "Copilot:"
          if [[ "${{ inputs.start_agent }}" == "true" ]]; then
            echo "  AUTOPILOT EXECUTED"
          else
            echo "  DISABLED"
          fi
          echo
          echo "============================================================"
