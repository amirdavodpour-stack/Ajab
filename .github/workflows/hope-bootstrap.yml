name: HOPE Bootstrap → ZIP → Prepare → Copilot Autopilot

on:
  workflow_dispatch:
    inputs:
      archive:
        description: "ZIP filename in repository. Leave empty to auto-detect."
        required: false
        type: string
        default: ""

      start_agent:
        description: "Start GitHub Copilot automatically."
        required: false
        type: boolean
        default: true

      max_autopilot_continues:
        description: "Maximum Copilot autonomous continuations."
        required: false
        type: number
        default: 12

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: hope-bootstrap-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGING_DIR: /tmp/hope-bootstrap
  REPO_DIR: ${{ github.workspace }}

jobs:
  bootstrap:
    name: Bootstrap HOPE
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      # ============================================================
      # 1 — CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ============================================================
      # 2 — INITIALIZE
      # ============================================================

      - name: Initialize bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "HOPE BOOTSTRAP"
          echo "=============================================="
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Branch     : $GITHUB_REF_NAME"
          echo "Commit     : $GITHUB_SHA"
          echo "Workspace  : $GITHUB_WORKSPACE"

          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"

      # ============================================================
      # 3 — FIND ZIP
      # ============================================================

      - name: Find HOPE ZIP
        id: archive
        shell: bash
        run: |
          set -Eeuo pipefail

          REQUESTED="${{ inputs.archive }}"

          if [[ -n "$REQUESTED" ]]; then

            if [[ ! -f "$REQUESTED" ]]; then
              echo "::error::ZIP not found: $REQUESTED"
              exit 1
            fi

            SELECTED="$REQUESTED"

          else

            mapfile -t ZIP_FILES < <(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -iname "*.zip" \
                -not -path "$GITHUB_WORKSPACE/.git/*" \
                | sort
            )

            if [[ "${#ZIP_FILES[@]}" -eq 0 ]]; then
              echo "::error::No ZIP file found."
              exit 1
            fi

            SELECTED=""

            # Prefer a HOPE-named ZIP.
            for FILE in "${ZIP_FILES[@]}"; do
              BASE="$(basename "$FILE")"

              if [[ "$BASE" == *HOPE* || "$BASE" == *hope* ]]; then
                SELECTED="$FILE"
                break
              fi
            done

            # Fallback.
            if [[ -z "$SELECTED" ]]; then
              SELECTED="${ZIP_FILES[0]}"
            fi

          fi

          echo "Selected archive:"
          echo "$SELECTED"

          echo "archive=$SELECTED" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 4 — VALIDATE ZIP
      # ============================================================

      - name: Validate ZIP
        shell: bash
        env:
          ZIP: ${{ steps.archive.outputs.archive }}
        run: |
          set -Eeuo pipefail

          echo "Testing ZIP..."

          unzip -t "$ZIP"

          echo
          echo "ZIP integrity: OK"

      # ============================================================
      # 5 — SECURITY CHECK
      # ============================================================

      - name: Validate archive paths
        shell: bash
        env:
          ZIP: ${{ steps.archive.outputs.archive }}
        run: |
          set -Eeuo pipefail

          echo "Checking archive paths..."

          while IFS= read -r ENTRY; do

            if [[ "$ENTRY" == /* ]]; then
              echo "::error::Absolute path detected: $ENTRY"
              exit 1
            fi

            if [[ "$ENTRY" == ../* ]]; then
              echo "::error::Path traversal detected: $ENTRY"
              exit 1
            fi

            if [[ "$ENTRY" == */../* ]]; then
              echo "::error::Path traversal detected: $ENTRY"
              exit 1
            fi

            if [[ "$ENTRY" == *"/.." ]]; then
              echo "::error::Path traversal detected: $ENTRY"
              exit 1
            fi

          done < <(unzip -Z1 "$ZIP")

          echo "Archive path validation: OK"

      # ============================================================
      # 6 — EXTRACT OUTSIDE GITHUB WORKSPACE
      # ============================================================

      - name: Extract project
        shell: bash
        env:
          ZIP: ${{ steps.archive.outputs.archive }}
        run: |
          set -Eeuo pipefail

          EXTRACT="$STAGING_DIR/extracted"

          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"

          echo "Extracting into:"
          echo "$EXTRACT"

          unzip -q "$ZIP" -d "$EXTRACT"

          echo
          echo "Extraction complete."

          find "$EXTRACT" \
            -maxdepth 3 \
            -type d \
            | sort \
            | head -200

      # ============================================================
      # 7 — DETECT PROJECT ROOT
      # ============================================================

      - name: Detect project root
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail

          EXTRACT="$STAGING_DIR/extracted"

          ROOT="$EXTRACT"

          mapfile -t TOP_DIRS < <(
            find "$EXTRACT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -not -name ".git" \
              | sort
          )

          mapfile -t TOP_FILES < <(
            find "$EXTRACT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type f \
              | sort
          )

          # ZIP has one wrapper directory.
          if [[ "${#TOP_FILES[@]}" -eq 0 &&
                "${#TOP_DIRS[@]}" -eq 1 ]]; then

            CANDIDATE="${TOP_DIRS[0]}"

            if [[ \
              -f "$CANDIDATE/pubspec.yaml" ||
              -f "$CANDIDATE/package.json" ||
              -d "$CANDIDATE/.github" ||
              -d "$CANDIDATE/docs"
            ]]; then

              ROOT="$CANDIDATE"

            fi
          fi

          echo "=============================================="
          echo "PROJECT ROOT"
          echo "=============================================="
          echo "$ROOT"

          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 8 — FIND SUPERPROMPT AUTOMATICALLY
      # ============================================================

      - name: Locate SUPERPROMPT
        id: prompt
        shell: bash
        env:
          ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set -Eeuo pipefail

          echo "Searching for SUPERPROMPT..."

          PROMPT=""

          # First preferred path.
          if [[ -f "$ROOT/docs/roadmap/SUPERPROMPT.md" ]]; then
            PROMPT="$ROOT/docs/roadmap/SUPERPROMPT.md"
          fi

          # Then search for known names.
          if [[ -z "$PROMPT" ]]; then
            while IFS= read -r FILE; do

              if grep -q "HOPE SUPERPROMPT" "$FILE" 2>/dev/null; then
                PROMPT="$FILE"
                break
              fi

            done < <(
              find "$ROOT" \
                -type f \
                \( \
                  -iname "*SUPERPROMPT*.md" \
                  -o \
                  -iname "*SUPER-PROMPT*.md" \
                \) \
                | sort
            )
          fi

          if [[ -z "$PROMPT" ]]; then
            echo "::error::No HOPE SUPERPROMPT found."
            echo
            echo "Markdown files containing SUPERPROMPT:"
            find "$ROOT" \
              -type f \
              -iname "*.md" \
              | sort \
              | grep -i "prompt" \
              || true

            exit 1
          fi

          echo "SUPERPROMPT found:"
          echo "$PROMPT"

          echo "prompt=$PROMPT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 9 — SYNCHRONIZE SAFELY
      # ============================================================

      - name: Synchronize extracted project
        shell: bash
        env:
          ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set -Eeuo pipefail

          echo "Synchronizing project into Git workspace..."

          # IMPORTANT:
          # Source is /tmp.
          # Destination is GitHub workspace.
          #
          # Therefore source is NOT inside destination and
          # rsync --delete cannot delete its own source.

          rsync -a \
            --delete \
            --exclude '.git/' \
            --exclude '.github/workflows/hope-bootstrap.yml' \
            --exclude '.hope-bootstrap/' \
            "$ROOT/" \
            "$GITHUB_WORKSPACE/"

          echo
          echo "Synchronization complete."

      # ============================================================
      # 10 — VERIFY SUPERPROMPT AFTER SYNC
      # ============================================================

      - name: Verify repository SUPERPROMPT
        shell: bash
        run: |
          set -Eeuo pipefail

          PROMPT="docs/roadmap/SUPERPROMPT.md"

          if [[ ! -f "$PROMPT" ]]; then
            echo "::error::$PROMPT missing after synchronization."
            exit 1
          fi

          echo "Verified:"
          echo "$PROMPT"

      # ============================================================
      # 11 — PREPARE CODESPACES
      # ============================================================

      - name: Prepare Codespaces configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p .devcontainer

          cat > .devcontainer/devcontainer.json <<'EOF'
          {
            "name": "HOPE Super App",
            "image": "mcr.microsoft.com/devcontainers/base:ubuntu",
            "features": {
              "ghcr.io/devcontainers/features/git:1": {},
              "ghcr.io/devcontainers/features/github-cli:1": {},
              "ghcr.io/devcontainers/features/node:1": {
                "version": "22"
              }
            },
            "customizations": {
              "vscode": {
                "extensions": [
                  "Dart-Code.flutter",
                  "Dart-Code.dart-code",
                  "eamodio.gitlens"
                ]
              }
            }
          }
          EOF

      # ============================================================
      # 12 — CREATE AGENT HANDOFF
      # ============================================================

      - name: Create agent handoff
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p docs/roadmap

          cat > docs/roadmap/AGENT-HANDOFF.md <<'EOF'
          # HOPE Autonomous Agent Handoff

          ## Primary instruction

          Read:

          `docs/roadmap/SUPERPROMPT.md`

          before doing anything else.

          ## Rules

          1. Read STATE.
          2. Determine the current session.
          3. Execute only that session.
          4. Protect the existing jobs vertical.
          5. Inspect actual source before making architectural decisions.
          6. Do not invent schema/API behavior.
          7. Do not fake incomplete features.
          8. Verify every meaningful change.
          9. Update STATE.
          10. Commit the completed work.
          11. Leave a safe checkpoint.
          12. Prepare the project for the next session.

          ## Product target

          HOPE is being evolved into a professional multi-vertical
          marketplace / super-app.

          UX quality should be comparable to mature consumer
          super-apps and marketplaces.

          Snapp may be used as product-pattern inspiration only.

          Do NOT copy proprietary branding, assets, source code,
          or pixel-identical screens.

          Existing jobs functionality must remain operational.
          EOF

      # ============================================================
      # 13 — READ CURRENT SESSION
      # ============================================================

      - name: Read current session
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail

          FILE="docs/roadmap/SUPERPROMPT.md"

          SESSION="$(
            grep -E \
              '^[[:space:]]*current_session:' \
              "$FILE" \
              | head -1 \
              | sed -E \
              's/.*current_session:[[:space:]]*([0-9]+).*/\1/'
          )"

          if [[ -z "$SESSION" ]]; then
            SESSION="0"
          fi

          echo "Current session: $SESSION"

          echo "current_session=$SESSION" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 14 — NODE
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ============================================================
      # 15 — FLUTTER
      # ============================================================

      - name: Setup Flutter
        if: ${{ hashFiles('pubspec.yaml') != '' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ============================================================
      # 16 — INSTALL DEPENDENCIES
      # ============================================================

      - name: Prepare dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Preparing dependencies..."

          if [[ -f pubspec.yaml ]]; then
            flutter pub get
          fi

          if [[ -f package.json ]]; then
            if [[ -f package-lock.json ]]; then
              npm ci
            else
              npm install
            fi
          fi

          if [[ -f backend/package.json ]]; then
            (
              cd backend

              if [[ -f package-lock.json ]]; then
                npm ci
              else
                npm install
              fi
            )
          fi

      # ============================================================
      # 17 — CREATE AGENT BRANCH
      # ============================================================

      - name: Create Copilot session branch
        id: branch
        shell: bash
        run: |
          set -Eeuo pipefail

          SESSION="${{ steps.state.outputs.current_session }}"

          if [[ "$SESSION" == "0" ]]; then
            SESSION="1"
          fi

          BRANCH="copilot/hope-session-${SESSION}"

          git config user.name "HOPE Copilot Agent"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -C "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 18 — COMMIT BOOTSTRAP
      # ============================================================

      - name: Commit bootstrap preparation
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "HOPE Copilot Agent"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No bootstrap changes."
          else
            git commit \
              -m "chore(hope): prepare autonomous Copilot workspace"
          fi

      # ============================================================
      # 19 — PUSH BOOTSTRAP
      # ============================================================

      - name: Push bootstrap branch
        shell: bash
        run: |
          set -Eeuo pipefail

          BRANCH="${{ steps.branch.outputs.branch }}"

          git push \
            --force-with-lease \
            origin \
            "HEAD:$BRANCH"

      # ============================================================
      # 20 — INSTALL COPILOT CLI
      # ============================================================

      - name: Install GitHub Copilot CLI
        if: ${{ inputs.start_agent }}
        shell: bash
        run: |
          set -Eeuo pipefail

          npm install -g @github/copilot

          copilot --version

      # ============================================================
      # 21 — RUN COPILOT AUTOPILOT
      # ============================================================

      - name: Run HOPE with GitHub Copilot Autopilot
        if: ${{ inputs.start_agent }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          MAX_CONTINUES: ${{ inputs.max_autopilot_continues }}
        run: |
          set -Eeuo pipefail

          PROMPT="docs/roadmap/SUPERPROMPT.md"

          if [[ ! -f "$PROMPT" ]]; then
            echo "::error::SUPERPROMPT missing."
            exit 1
          fi

          SESSION="${{ steps.state.outputs.current_session }}"
          BRANCH="${{ steps.branch.outputs.branch }}"

          cat > /tmp/hope-agent-prompt.md <<EOF
          # HOPE AUTONOMOUS IMPLEMENTATION

          You are the autonomous senior engineering agent responsible
          for the HOPE Marketplace transformation.

          ================================================
          MANDATORY FIRST ACTION
          ================================================

          Read:

          docs/roadmap/SUPERPROMPT.md

          Treat the STATE block in that file as authoritative.

          Current bootstrap session:
          ${SESSION}

          Current Git branch:
          ${BRANCH}

          ================================================
          EXECUTION
          ================================================

          Execute ONLY the current session defined by
          docs/roadmap/SUPERPROMPT.md.

          Do not skip directly to later sessions.

          Do not ask the human for routine engineering decisions.

          Make reasonable decisions based on:
          - actual repository contents
          - existing architecture
          - current dependencies
          - existing database
          - existing jobs functionality
          - the session specification

          ================================================
          JOBS PROTECTION
          ================================================

          The existing jobs vertical is production-critical.

          Never intentionally remove or break it.

          Preserve:
          - existing behavior
          - data compatibility
          - API compatibility where practical
          - existing user flows

          ================================================
          UI/UX
          ================================================

          HOPE should evolve toward a premium consumer super-app.

          Use mature patterns found in products such as Snapp for
          inspiration in:
          - navigation
          - search
          - discovery
          - cards
          - bottom navigation
          - status
          - tracking
          - transaction flows
          - trust
          - responsiveness
          - perceived performance

          DO NOT copy:
          - logos
          - proprietary assets
          - source code
          - proprietary branding
          - pixel-identical screens

          Build an original HOPE design system.

          ================================================
          ENGINEERING
          ================================================

          Before changing architecture:
          inspect the real source.

          Before changing database:
          inspect the real schema.

          Before upgrading dependencies:
          inspect compatibility.

          Never invent functionality.

          Never fake backend behavior with UI-only state.

          Never weaken security to make a build pass.

          ================================================
          VERIFICATION
          ================================================

          After implementation:

          1. Run the narrowest meaningful verification.
          2. Fix failures caused by your changes.
          3. Re-run verification.
          4. Record actual results.

          Do NOT claim a test passed if it was not run.

          ================================================
          STATE
          ================================================

          At the end:

          1. Rewrite the STATE block in SUPERPROMPT.md.
          2. Record what actually shipped.
          3. Record what did not ship.
          4. Record verification results.
          5. Record risks.
          6. Define next_session accurately.

          ================================================
          GIT
          ================================================

          Commit the completed session.

          Stay on:

          ${BRANCH}

          Never intentionally push directly to main/master.

          ================================================
          FINAL CONDITION
          ================================================

          Leave the repository in a safe checkpoint.

          If the session cannot be safely completed, stop at the
          last verified checkpoint and document the incomplete work
          in STATE.

          Do not leave knowingly broken code.
          EOF

          echo "=============================================="
          echo "STARTING COPILOT"
          echo "=============================================="
          echo "Session: $SESSION"
          echo "Branch : $BRANCH"
          echo

          copilot \
            --autopilot \
            --allow-all \
            --no-ask-user \
            --max-autopilot-continues "$MAX_CONTINUES" \
            -p "$(cat /tmp/hope-agent-prompt.md)"

      # ============================================================
      # 22 — VERIFY AGENT OUTPUT
      # ============================================================

      - name: Verify agent output
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "POST-AGENT CHECK"
          echo "=============================================="

          echo
          echo "Git status:"
          git status --short || true

          echo
          echo "Recent commits:"
          git log --oneline -10 || true

          echo
          echo "SUPERPROMPT exists:"

          if [[ -f docs/roadmap/SUPERPROMPT.md ]]; then
            echo "YES"

            echo
            echo "Current STATE:"
            sed -n '/```yaml/,$p' \
              docs/roadmap/SUPERPROMPT.md \
              | tail -160

          else
            echo "NO"
            exit 1
          fi

      # ============================================================
      # 23 — COMMIT ANY REMAINING AGENT CHANGES
      # ============================================================

      - name: Commit remaining agent changes
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "HOPE Copilot Agent"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No remaining changes."
          else
            git commit \
              -m "feat(hope): complete autonomous session"
          fi

      # ============================================================
      # 24 — PUSH FINAL RESULT
      # ============================================================

      - name: Push final result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          BRANCH="${{ steps.branch.outputs.branch }}"

          git push \
            --force-with-lease \
            origin \
            "HEAD:$BRANCH"

      # ============================================================
      # 25 — SUMMARY
      # ============================================================

      - name: Final summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "=============================================="
          echo "HOPE BOOTSTRAP FINISHED"
          echo "=============================================="
          echo
          echo "Session : ${{ steps.state.outputs.current_session }}"
          echo "Branch  : ${{ steps.branch.outputs.branch }}"
          echo
          echo "SUPERPROMPT:"
          echo "docs/roadmap/SUPERPROMPT.md"
          echo
          echo "The next session is controlled by STATE."
