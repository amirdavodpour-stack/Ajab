name: HOPE Bootstrap → ZIP → Prepare → Copilot Autopilot

on:
  workflow_dispatch:
    inputs:
      archive:
        description: "ZIP filename in repository. Leave empty to auto-detect."
        required: false
        type: string
        default: ""

      start_agent:
        description: "Start GitHub Copilot automatically."
        required: false
        type: boolean
        default: true

      max_autopilot_continues:
        description: "Maximum Copilot autonomous continuations."
        required: false
        type: number
        default: 12

# The workflow itself does not depend on GITHUB_TOKEN for repository writes.
# Repository operations use HOPE_BOOTSTRAP_TOKEN.
permissions:
  contents: read

concurrency:
  group: hope-bootstrap-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGING_DIR: /tmp/hope-bootstrap
  NODE_VERSION: "22"

jobs:
  bootstrap:
    name: Bootstrap HOPE
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:

      # ============================================================
      # 1 — CHECKOUT WITH PAT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.HOPE_BOOTSTRAP_TOKEN }}

      # ============================================================
      # 2 — INITIALIZE
      # ============================================================

      - name: Initialize bootstrap
        shell: bash
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.HOPE_BOOTSTRAP_TOKEN }}
        run: |
          set -Eeuo pipefail

          echo "::add-mask::$BOOTSTRAP_TOKEN"

          echo "=============================================="
          echo "HOPE BOOTSTRAP"
          echo "=============================================="
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Ref        : $GITHUB_REF"
          echo "Branch     : $GITHUB_REF_NAME"
          echo "Commit     : $GITHUB_SHA"
          echo "Runner     : $RUNNER_OS"
          echo

          if [[ -z "${BOOTSTRAP_TOKEN:-}" ]]; then
            echo "::error::HOPE_BOOTSTRAP_TOKEN is missing."
            echo
            echo "Create repository secret:"
            echo "Settings → Secrets and variables → Actions"
            echo "Name: HOPE_BOOTSTRAP_TOKEN"
            exit 1
          fi

          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"

          git config user.name "HOPE Autonomous Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo
          echo "Current repository state:"
          git status --short

      # ============================================================
      # 3 — VERIFY AUTHENTICATION
      # ============================================================

      - name: Verify repository authentication
        shell: bash
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.HOPE_BOOTSTRAP_TOKEN }}
        run: |
          set -Eeuo pipefail

          echo "::add-mask::$BOOTSTRAP_TOKEN"

          echo "Testing authenticated Git access..."

          if ! git ls-remote origin HEAD >/dev/null 2>&1; then
            echo "::error::HOPE_BOOTSTRAP_TOKEN could not authenticate to this repository."
            exit 1
          fi

          echo "Git authentication: OK"

      # ============================================================
      # 4 — LOCATE ZIP
      # ============================================================

      - name: Find HOPE ZIP
        id: archive
        shell: bash
        run: |
          set -Eeuo pipefail

          REQUESTED="${{ inputs.archive }}"

          if [[ -n "$REQUESTED" ]]; then
            if [[ ! -f "$REQUESTED" ]]; then
              echo "::error::Requested ZIP not found: $REQUESTED"
              exit 1
            fi

            SELECTED="$REQUESTED"
          else
            mapfile -t ZIP_FILES < <(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -iname "*.zip" \
                -not -path "$GITHUB_WORKSPACE/.git/*" \
                -not -path "$GITHUB_WORKSPACE/.hope-bootstrap/*" \
                | sort
            )

            if [[ "${#ZIP_FILES[@]}" -eq 0 ]]; then
              echo "::error::No ZIP file found in repository."
              exit 1
            fi

            SELECTED=""

            # Prefer HOPE archive names.
            for FILE in "${ZIP_FILES[@]}"; do
              BASE="$(basename "$FILE")"

              if [[ "$BASE" == *HOPE* || "$BASE" == *hope* ]]; then
                SELECTED="$FILE"
                break
              fi
            done

            # Fallback to first ZIP.
            if [[ -z "$SELECTED" ]]; then
              SELECTED="${ZIP_FILES[0]}"
            fi
          fi

          echo
          echo "=============================================="
          echo "SELECTED ARCHIVE"
          echo "=============================================="
          echo "$SELECTED"

          echo "archive=$SELECTED" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 5 — ZIP INTEGRITY
      # ============================================================

      - name: Validate ZIP integrity
        shell: bash
        env:
          ZIP: ${{ steps.archive.outputs.archive }}
        run: |
          set -Eeuo pipefail

          echo "Testing ZIP integrity..."
          unzip -t "$ZIP"

          echo
          echo "ZIP integrity: OK"

      # ============================================================
      # 6 — ZIP PATH SECURITY
      # ============================================================

      - name: Validate archive paths
        shell: bash
        env:
          ZIP: ${{ steps.archive.outputs.archive }}
        run: |
          set -Eeuo pipefail

          echo "Checking archive paths..."

          while IFS= read -r ENTRY; do

            if [[ "$ENTRY" == /* ]]; then
              echo "::error::Absolute path detected: $ENTRY"
              exit 1
            fi

            if [[ "$ENTRY" =~ ^[A-Za-z]: ]]; then
              echo "::error::Windows absolute path detected: $ENTRY"
              exit 1
            fi

            if [[ "$ENTRY" == ../* ]]; then
              echo "::error::Path traversal detected: $ENTRY"
              exit 1
            fi

            if [[ "$ENTRY" == */../* ]]; then
              echo "::error::Path traversal detected: $ENTRY"
              exit 1
            fi

            if [[ "$ENTRY" == */.. ]]; then
              echo "::error::Path traversal detected: $ENTRY"
              exit 1
            fi

            if [[ "$ENTRY" == ..\\* ]]; then
              echo "::error::Path traversal detected: $ENTRY"
              exit 1
            fi

            if [[ "$ENTRY" == *\\..\\* ]]; then
              echo "::error::Path traversal detected: $ENTRY"
              exit 1
            fi

          done < <(unzip -Z1 "$ZIP")

          echo "Archive path validation: OK"

      # ============================================================
      # 7 — EXTRACT
      # ============================================================

      - name: Extract HOPE project
        shell: bash
        env:
          ZIP: ${{ steps.archive.outputs.archive }}
        run: |
          set -Eeuo pipefail

          EXTRACT="$STAGING_DIR/extracted"

          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"

          echo "Extracting:"
          echo "$ZIP"

          unzip -q "$ZIP" -d "$EXTRACT"

          echo
          echo "Extraction complete."

          echo
          echo "Extracted top-level content:"
          find "$EXTRACT" \
            -mindepth 1 \
            -maxdepth 2 \
            | sort \
            | head -300

      # ============================================================
      # 8 — DETECT PROJECT ROOT
      # ============================================================

      - name: Detect project root
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail

          EXTRACT="$STAGING_DIR/extracted"
          ROOT="$EXTRACT"

          mapfile -t TOP_DIRS < <(
            find "$EXTRACT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -not -name ".git" \
              | sort
          )

          mapfile -t TOP_FILES < <(
            find "$EXTRACT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type f \
              | sort
          )

          # Handle ZIPs containing one enclosing directory.
          if [[ "${#TOP_FILES[@]}" -eq 0 &&
                "${#TOP_DIRS[@]}" -eq 1 ]]; then

            CANDIDATE="${TOP_DIRS[0]}"

            if [[ \
              -f "$CANDIDATE/pubspec.yaml" ||
              -f "$CANDIDATE/package.json" ||
              -d "$CANDIDATE/.github" ||
              -d "$CANDIDATE/docs"
            ]]; then
              ROOT="$CANDIDATE"
            fi
          fi

          echo
          echo "=============================================="
          echo "PROJECT ROOT"
          echo "=============================================="
          echo "$ROOT"

          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 9 — LOCATE SUPERPROMPT
      # ============================================================

      - name: Locate SUPERPROMPT
        id: prompt
        shell: bash
        env:
          ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set -Eeuo pipefail

          PROMPT=""

          if [[ -f "$ROOT/docs/roadmap/SUPERPROMPT.md" ]]; then
            PROMPT="$ROOT/docs/roadmap/SUPERPROMPT.md"
          fi

          if [[ -z "$PROMPT" ]]; then

            while IFS= read -r FILE; do

              if grep -qiE \
                "HOPE[[:space:]]+SUPER[-]?PROMPT" \
                "$FILE" \
                2>/dev/null; then

                PROMPT="$FILE"
                break

              fi

            done < <(
              find "$ROOT" \
                -type f \
                \( \
                  -iname "*SUPERPROMPT*.md" \
                  -o \
                  -iname "*SUPER-PROMPT*.md" \
                \) \
                | sort
            )
          fi

          if [[ -z "$PROMPT" ]]; then
            echo "::error::No HOPE SUPERPROMPT found."
            exit 1
          fi

          echo
          echo "SUPERPROMPT:"
          echo "$PROMPT"

          echo "prompt=$PROMPT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 10 — SYNCHRONIZE PROJECT
      # ============================================================

      - name: Synchronize extracted project
        shell: bash
        env:
          ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set -Eeuo pipefail

          echo "Synchronizing extracted project..."

          rsync -a \
            --exclude ".git/" \
            --exclude ".hope-bootstrap/" \
            --exclude ".github/workflows/hope-bootstrap.yml" \
            "$ROOT/" \
            "$GITHUB_WORKSPACE/"

          echo
          echo "Synchronization complete."

      # ============================================================
      # 11 — VERIFY SUPERPROMPT
      # ============================================================

      - name: Verify synchronized project
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ -d ".git" ]] || {
            echo "::error::.git directory missing."
            exit 1
          }

          [[ -f "docs/roadmap/SUPERPROMPT.md" ]] || {
            echo "::error::docs/roadmap/SUPERPROMPT.md missing."
            exit 1
          }

          echo "Project verification: OK"

          echo
          echo "Important project files:"

          for FILE in \
            "docs/roadmap/SUPERPROMPT.md" \
            "docs/roadmap/MULTI-VERTICAL-ROADMAP.md" \
            "pubspec.yaml" \
            "pubspec.lock" \
            "package.json" \
            "package-lock.json"
          do
            if [[ -e "$FILE" ]]; then
              echo "[OK] $FILE"
            fi
          done

      # ============================================================
      # 12 — CODESPACES
      # ============================================================

      - name: Prepare Codespaces configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p .devcontainer

          cat > .devcontainer/devcontainer.json <<'EOF'
          {
            "name": "HOPE Super App",
            "image": "mcr.microsoft.com/devcontainers/base:ubuntu",
            "features": {
              "ghcr.io/devcontainers/features/git:1": {},
              "ghcr.io/devcontainers/features/github-cli:1": {},
              "ghcr.io/devcontainers/features/node:1": {
                "version": "22"
              }
            },
            "customizations": {
              "vscode": {
                "extensions": [
                  "Dart-Code.flutter",
                  "Dart-Code.dart-code",
                  "eamodio.gitlens"
                ]
              }
            },
            "postCreateCommand": "echo 'HOPE Codespace ready'"
          }
          EOF

      # ============================================================
      # 13 — AGENT HANDOFF
      # ============================================================

      - name: Create agent handoff
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p docs/roadmap

          cat > docs/roadmap/AGENT-HANDOFF.md <<'EOF'
          # HOPE Autonomous Agent Handoff

          ## PRIMARY DIRECTIVE

          Read `docs/roadmap/SUPERPROMPT.md` completely before making changes.

          Then:

          1. Read current STATE.
          2. Read active session plan.
          3. Read roadmap.
          4. Inspect actual repository architecture.
          5. Inspect Flutter implementation.
          6. Inspect backend implementation.
          7. Inspect database/schema.
          8. Inspect existing Jobs functionality.
          9. Distinguish real functionality from placeholders.
          10. Execute only the current session.

          ## NON-NEGOTIABLES

          Existing Jobs functionality MUST remain functional.

          Never invent:

          - API endpoints
          - database fields
          - authentication behavior
          - authorization rules
          - payment semantics
          - undocumented business rules

          Inspect first.

          ## ENGINEERING

          Prefer:

          - existing architecture where sound
          - feature-oriented structure
          - reusable components
          - typed models
          - repositories/services
          - explicit state handling
          - centralized navigation
          - centralized error handling
          - localization
          - RTL support
          - accessibility
          - responsive layouts
          - production-quality validation

          Every meaningful UI flow should consider:

          - loading
          - success
          - empty
          - error
          - retry
          - validation
          - disabled state
          - accessibility
          - responsive layout
          - localization
          - RTL

          ## SECURITY

          Never weaken:

          - authentication
          - authorization
          - validation
          - rate limiting
          - secure storage
          - transport security
          - audit logging

          Never hardcode secrets.

          Never commit credentials.

          Never disable security merely to make a build pass.

          ## VERIFICATION

          Flutter:

          - dart format
          - flutter analyze
          - relevant flutter test
          - build checks when appropriate

          Node/backend:

          - lint when available
          - test when available
          - build when available

          Never claim success for commands that were not actually run.

          ## GIT

          Work only on the dedicated session branch.

          Never force-push main/master.

          Do not rewrite unrelated history.

          Always inspect:

          - git status
          - git diff
          - git diff --check

          before closeout.

          ## CLOSEOUT

          Before completion:

          1. Finish current session.
          2. Run verification.
          3. Update STATE.
          4. Record completed work.
          5. Record changed files.
          6. Record verification.
          7. Record blockers.
          8. Record risks.
          9. Record next session.
          10. Commit a clean checkpoint.

          Never fake completion.
          Never mark incomplete work complete.
          EOF

      # ============================================================
      # 14 — READ CURRENT SESSION
      # ============================================================

      - name: Read current session
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail

          FILE="docs/roadmap/SUPERPROMPT.md"
          SESSION=""

          if grep -qE \
            '^[[:space:]]*current_session:' \
            "$FILE"; then

            SESSION="$(
              grep -E \
                '^[[:space:]]*current_session:' \
                "$FILE" \
                | head -1 \
                | sed -E \
                  's/.*current_session:[[:space:]]*([0-9]+).*/\1/'
            )"
          fi

          [[ -z "$SESSION" ]] && SESSION="1"

          echo "Current session: $SESSION"

          echo "current_session=$SESSION" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 15 — NODE
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ============================================================
      # 16 — FLUTTER
      # ============================================================

      - name: Setup Flutter
        if: ${{ hashFiles('pubspec.yaml') != '' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ============================================================
      # 17 — TOOLCHAIN
      # ============================================================

      - name: Show toolchain
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "TOOLCHAIN"
          echo "=============================================="

          node --version
          npm --version
          git --version

          if command -v flutter >/dev/null 2>&1; then
            flutter --version
          fi

          if command -v dart >/dev/null 2>&1; then
            dart --version
          fi

      # ============================================================
      # 18 — DEPENDENCIES
      # ============================================================

      - name: Prepare dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f pubspec.yaml ]]; then
            echo "Installing Flutter dependencies..."
            flutter pub get
          fi

          if [[ -f package.json ]]; then
            echo "Installing root Node dependencies..."

            if [[ -f package-lock.json ]]; then
              npm ci
            else
              npm install
            fi
          fi

          if [[ -f backend/package.json ]]; then
            echo "Installing backend dependencies..."

            (
              cd backend

              if [[ -f package-lock.json ]]; then
                npm ci
              else
                npm install
              fi
            )
          fi

      # ============================================================
      # 19 — SESSION BRANCH
      # ============================================================

      - name: Create or resume Copilot session branch
        id: branch
        shell: bash
        run: |
          set -Eeuo pipefail

          SESSION="${{ steps.state.outputs.current_session }}"

          [[ -z "$SESSION" ]] && SESSION="1"

          BRANCH="copilot/hope-session-${SESSION}"

          git config user.name "HOPE Autonomous Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Target branch: $BRANCH"

          git fetch origin --prune

          if git ls-remote \
            --exit-code \
            --heads \
            origin \
            "$BRANCH" >/dev/null 2>&1; then

            echo "Remote branch exists."
            echo "Resuming existing session branch."

            git fetch origin "$BRANCH"
            git switch -C "$BRANCH" "origin/$BRANCH"

          else

            echo "Remote branch does not exist."
            echo "Creating new session branch."

            git switch -C "$BRANCH"

          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 20 — COMMIT BOOTSTRAP PREPARATION
      # ============================================================

      - name: Commit bootstrap preparation
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "HOPE Autonomous Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No bootstrap preparation changes."
          else
            git commit \
              -m "chore(hope): prepare autonomous Copilot workspace"
          fi

      # ============================================================
      # 21 — PUSH BOOTSTRAP
      # ============================================================
      #
      # IMPORTANT:
      # This uses HOPE_BOOTSTRAP_TOKEN through actions/checkout.
      # Therefore Git pushes DO NOT use GITHUB_TOKEN.
      # This is what allows workflow files under .github/workflows/
      # to be created/updated.
      # ============================================================

      - name: Push bootstrap branch
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          BOOTSTRAP_TOKEN: ${{ secrets.HOPE_BOOTSTRAP_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::add-mask::$BOOTSTRAP_TOKEN"

          if [[ -z "${BOOTSTRAP_TOKEN:-}" ]]; then
            echo "::error::HOPE_BOOTSTRAP_TOKEN is missing."
            exit 1
          fi

          echo "=============================================="
          echo "PUSH BOOTSTRAP BRANCH"
          echo "=============================================="
          echo "Branch: $BRANCH"

          # Checkout already configured origin with the PAT.
          git push \
            --set-upstream \
            origin \
            "$BRANCH"

          echo
          echo "Bootstrap branch pushed successfully."

      # ============================================================
      # 22 — INSTALL COPILOT CLI
      # ============================================================

      - name: Install GitHub Copilot CLI
        if: ${{ inputs.start_agent }}
        shell: bash
        run: |
          set -Eeuo pipefail

          npm install -g @github/copilot

          echo
          copilot --version

      # ============================================================
      # 23 — BUILD COPILOT PROMPT
      # ============================================================

      - name: Build Copilot instruction
        if: ${{ inputs.start_agent }}
        env:
          SESSION: ${{ steps.state.outputs.current_session }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          PROMPT: ${{ steps.prompt.outputs.prompt }}
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > /tmp/hope-agent-prompt.md <<EOF
          # HOPE AUTONOMOUS ENGINEERING SESSION

          You are the autonomous implementation agent for HOPE.

          ============================================================
          AUTHORITATIVE SOURCE
          ============================================================

          FIRST read completely:

          docs/roadmap/SUPERPROMPT.md

          Detected SUPERPROMPT:

          $PROMPT

          ============================================================
          CURRENT SESSION
          ============================================================

          Session:
          $SESSION

          Branch:
          $BRANCH

          Execute ONLY the current session unless the authoritative
          SUPERPROMPT explicitly requires another dependency.

          ============================================================
          MANDATORY FIRST ACTIONS
          ============================================================

          1. Read docs/roadmap/SUPERPROMPT.md completely.
          2. Read current STATE.
          3. Read active session plan.
          4. Read roadmap.
          5. Inspect repository structure.
          6. Inspect Flutter architecture.
          7. Inspect backend architecture.
          8. Inspect database/schema.
          9. Inspect authentication.
          10. Inspect existing Jobs functionality.
          11. Inspect tests.
          12. Inspect CI/CD.
          13. Determine what is real versus placeholder.

          Never rely on assumptions.

          ============================================================
          PRODUCT RULE
          ============================================================

          HOPE is evolving toward a professional multi-vertical
          marketplace / super-app.

          Existing Jobs functionality MUST remain functional.

          Snapp may be used only as inspiration for interaction
          patterns and marketplace ergonomics.

          Never copy proprietary implementation, assets, branding,
          trademarks, or pixel-identical screens.

          ============================================================
          ENGINEERING RULES
          ============================================================

          Prefer sound existing architecture.

          Prefer:

          - feature-oriented structure
          - reusable design-system components
          - typed models
          - repositories/services
          - explicit state management
          - centralized navigation
          - centralized error handling
          - localization
          - RTL support
          - accessibility semantics
          - responsive breakpoints
          - testable code
          - maintainable code

          Meaningful UI must properly handle:

          - loading
          - success
          - empty
          - error
          - retry
          - disabled
          - validation
          - accessibility
          - localization
          - RTL
          - responsive layouts

          Do NOT create decorative fake functionality.

          ============================================================
          BACKEND RULES
          ============================================================

          Never invent:

          - API endpoints
          - database fields
          - authentication semantics
          - authorization semantics
          - payment semantics
          - business rules

          Inspect the actual implementation first.

          Preserve backward compatibility unless the current session
          explicitly defines a migration.

          ============================================================
          SECURITY
          ============================================================

          Never weaken:

          - authentication
          - authorization
          - validation
          - rate limiting
          - secure storage
          - transport security
          - audit logging

          Never hardcode secrets.

          Never commit credentials.

          Never disable security controls merely to make a build pass.

          ============================================================
          DEPENDENCY RULE
          ============================================================

          Reuse existing dependencies whenever practical.

          Do not add dependencies without clear technical justification.

          ============================================================
          VERIFICATION
          ============================================================

          Flutter:

          - dart format
          - flutter analyze
          - relevant flutter test
          - build checks when appropriate

          Node/backend:

          - lint when available
          - test when available
          - build when available

          Run real commands.

          Never claim success for a command that was not actually run.

          ============================================================
          GIT
          ============================================================

          Work ONLY on:

          $BRANCH

          Never force-push main/master.

          Do not rewrite unrelated history.

          Inspect:

          git status
          git diff
          git diff --check

          before closeout.

          ============================================================
          CLOSEOUT
          ============================================================

          Before finishing:

          1. Complete the current session.
          2. Run verification.
          3. Update STATE.
          4. Record completed work.
          5. Record changed files.
          6. Record verification.
          7. Record blockers.
          8. Record risks.
          9. Record next session.
          10. Commit a clean checkpoint.

          Never fake completion.

          Never mark incomplete work as complete.

          Start immediately by reading SUPERPROMPT and STATE.
          EOF

          echo "Copilot instruction created."

      # ============================================================
      # 24 — COPILOT AUTOPILOT
      # ============================================================

      - name: Run HOPE with GitHub Copilot Autopilot
        if: ${{ inputs.start_agent }}
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.HOPE_BOOTSTRAP_TOKEN }}
          GH_TOKEN: ${{ secrets.HOPE_BOOTSTRAP_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.HOPE_BOOTSTRAP_TOKEN }}
          MAX_CONTINUES: ${{ inputs.max_autopilot_continues }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::add-mask::$COPILOT_GITHUB_TOKEN"

          echo "=============================================="
          echo "GITHUB COPILOT AUTOPILOT"
          echo "=============================================="

          copilot --version

          echo
          echo "Maximum autonomous continuations:"
          echo "$MAX_CONTINUES"

          echo
          echo "Starting autonomous HOPE session..."

          copilot \
            --autopilot \
            --yolo \
            --no-banner \
            --max-autopilot-continues "$MAX_CONTINUES" \
            -p "$(cat /tmp/hope-agent-prompt.md)"

          echo
          echo "Copilot Autopilot finished."

      # ============================================================
      # 25 — AGENT OUTPUT
      # ============================================================

      - name: Verify agent output
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "POST-AGENT CHECK"
          echo "=============================================="

          echo
          echo "Git status:"
          git status --short

          echo
          echo "Recent commits:"
          git --no-pager log \
            --oneline \
            --decorate \
            -15

          echo
          echo "Checking SUPERPROMPT..."

          if [[ ! -f docs/roadmap/SUPERPROMPT.md ]]; then
            echo "::error::SUPERPROMPT disappeared."
            exit 1
          fi

          echo "SUPERPROMPT: OK"

          echo
          echo "STATE candidates:"

          find docs \
            -type f \
            \( \
              -iname "*STATE*.yml" \
              -o \
              -iname "*STATE*.yaml" \
              -o \
              -iname "*STATE*.md" \
            \) \
            | sort \
            | head -100 \
            || true

      # ============================================================
      # 26 — DIFF CHECK
      # ============================================================

      - name: Verify Git diff
        shell: bash
        run: |
          set -Eeuo pipefail

          git diff --check

          echo
          echo "Diff summary:"
          git diff --stat

          echo
          echo "Git diff check: OK"

      # ============================================================
      # 27 — FLUTTER VERIFICATION
      # ============================================================

      - name: Verify Flutter project
        if: ${{ hashFiles('pubspec.yaml') != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          flutter pub get

          FORMAT_TARGETS=("lib")

          if [[ -d "test" ]]; then
            FORMAT_TARGETS+=("test")
          fi

          dart format \
            --output=none \
            --set-exit-if-changed \
            "${FORMAT_TARGETS[@]}"

          flutter analyze

          if [[ -d test ]]; then
            flutter test
          fi

          echo
          echo "Flutter verification completed."

      # ============================================================
      # 28 — OPTIONAL FLUTTER RELEASE BUILD
      # ============================================================

      - name: Verify Flutter Android release build
        if: ${{ hashFiles('android/app/build.gradle') != '' || hashFiles('android/app/build.gradle.kts') != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Attempting Flutter Android release build..."

          flutter build apk --release

          echo
          echo "APK build completed."

          echo
          echo "Generated APK files:"
          find build/app/outputs/flutter-apk \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print \
            2>/dev/null \
            || true

      # ============================================================
      # 29 — ROOT NODE VERIFICATION
      # ============================================================

      - name: Verify root Node project
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Running root Node verification..."

          if npm run | grep -qE '^[[:space:]]+lint'; then
            npm run lint
          fi

          if npm run | grep -qE '^[[:space:]]+test'; then
            npm test
          fi

          if npm run | grep -qE '^[[:space:]]+build'; then
            npm run build
          fi

          echo
          echo "Root Node verification completed."

      # ============================================================
      # 30 — BACKEND VERIFICATION
      # ============================================================

      - name: Verify backend project
        if: ${{ hashFiles('backend/package.json') != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          cd backend

          if npm run | grep -qE '^[[:space:]]+lint'; then
            npm run lint
          fi

          if npm run | grep -qE '^[[:space:]]+test'; then
            npm test
          fi

          if npm run | grep -qE '^[[:space:]]+build'; then
            npm run build
          fi

          echo
          echo "Backend verification completed."

      # ============================================================
      # 31 — FINAL STATUS
      # ============================================================

      - name: Final repository status
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "FINAL REPOSITORY STATUS"
          echo "=============================================="

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Git status:"
          git status --short

          echo
          echo "Changed files:"
          git diff --name-status || true

          echo
          echo "Recent commits:"
          git --no-pager log \
            --oneline \
            --decorate \
            -10

      # ============================================================
      # 32 — FINAL COMMIT
      # ============================================================

      - name: Commit final agent changes
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "HOPE Autonomous Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No uncommitted changes after agent execution."
          else
            git commit \
              -m "feat(hope): complete autonomous session"
          fi

      # ============================================================
      # 33 — FINAL PUSH
      # ============================================================

      - name: Push final agent changes
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          BOOTSTRAP_TOKEN: ${{ secrets.HOPE_BOOTSTRAP_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::add-mask::$BOOTSTRAP_TOKEN"

          if [[ -z "${BOOTSTRAP_TOKEN:-}" ]]; then
            echo "::error::HOPE_BOOTSTRAP_TOKEN is missing."
            exit 1
          fi

          echo "=============================================="
          echo "PUSH FINAL AGENT CHANGES"
          echo "=============================================="
          echo "Branch: $BRANCH"

          git push \
            --set-upstream \
            origin \
            "$BRANCH"

          echo
          echo "Final agent changes pushed successfully."

      # ============================================================
      # 34 — FINAL SUMMARY
      # ============================================================

      - name: Final summary
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          SESSION: ${{ steps.state.outputs.current_session }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "============================================================"
          echo "HOPE BOOTSTRAP COMPLETE"
          echo "============================================================"
          echo
          echo "Repository:"
          echo "  $GITHUB_REPOSITORY"
          echo
          echo "Session:"
          echo "  $SESSION"
          echo
          echo "Branch:"
          echo "  $BRANCH"
          echo
          echo "SUPERPROMPT:"
          echo "  docs/roadmap/SUPERPROMPT.md"
          echo
          echo "Copilot:"
          if [[ "${{ inputs.start_agent }}" == "true" ]]; then
            echo "  AUTOPILOT EXECUTED"
          else
            echo "  DISABLED"
          fi
          echo
          echo "============================================================"
